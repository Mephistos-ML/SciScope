name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  semantic-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            --package semantic-release \
            --package @semantic-release/changelog \
            --package @semantic-release/commit-analyzer \
            --package @semantic-release/exec \
            --package @semantic-release/git \
            --package @semantic-release/github \
            --package @semantic-release/release-notes-generator \
            --package conventional-changelog-conventionalcommits \
            semantic-release
