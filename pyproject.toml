[project]
name = "sciscope"
description = "Scientific signal monitoring for narrow research topics."
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.19,<1.20",
    "psycopg[binary]>=3.3,<3.4",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.52,<0.53",
    "PyJWT[crypto]>=2.10,<2.11",
    "httpx2>=2.9,<2.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}
