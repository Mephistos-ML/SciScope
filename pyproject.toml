[project]
name = "sciscope"
version = "0.1.0"
description = "Scientific signal monitoring for narrow research topics."
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.19,<1.20",
    "psycopg[binary]>=3.3,<3.4",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.52,<0.53",
    "PyJWT[crypto]>=2.10,<2.11",
    "httpx>=0.28,<0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}
