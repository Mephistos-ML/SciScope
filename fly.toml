app = "sciscope-api"
primary_region = "ams"

[build]
dockerfile = "backend/Dockerfile"

[deploy]
  release_command = "alembic -c backend/alembic.ini upgrade head"

[env]
APP_ENV = "production"
APP_HOST = "0.0.0.0"
APP_PORT = "8000"
CORS_ORIGINS = "https://sciscope.uk,https://www.sciscope.uk"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "off"
auto_start_machines = false
min_machines_running = 1

[[http_service.checks]]
grace_period = "10s"
interval = "15s"
method = "GET"
path = "/ready"
timeout = "5s"
